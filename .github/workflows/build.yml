name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore src/AspNetCoreTemplate.slnx

      - name: Build
        run: dotnet build src/AspNetCoreTemplate.slnx -c Release --no-restore

      # AspNetCoreTemplate.Web.Tests is excluded: its two example tests boot the
      # whole app through WebApplicationFactory, which connects to SQL Server.
      # Run them locally against a database.
      # The tests run on Microsoft Testing Platform, which src/global.json turns
      # on for dotnet test, so this step has to run from the src folder.
      - name: Test
        working-directory: src
        run: >
          dotnet test --project Tests/AspNetCoreTemplate.Services.Data.Tests/AspNetCoreTemplate.Services.Data.Tests.csproj
          -c Release --no-build --report-xunit-trx --report-xunit-trx-filename test-results.trx

      # The renamer tool is not part of the template, so it has its own solution.
      - name: Build the template renamer
        run: dotnet build tools/TemplateRenamer/TemplateRenamer.slnx -c Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
